<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CodeQuality Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#fff; --surface:#fef4df; --raised:#fbf4e6; --line:#d7cdb8; --soft:#e8e0cd;
  --ink:#020405; --muted:#6b6455; --faint:#9a917e;
  --amber:#fac547; --aink:#b75000; --amid:#f99c00;
  --fail:#c2410c; --warn:#d99a12; --pass:#6f8f3e;
  --fail-bg:#fbe9e0; --warn-bg:#fdf4de; --pass-bg:#eef4e4;
  --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:'Inconsolata',Monaco,"Courier New",monospace;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#000001; --surface:#020405; --raised:#12171a; --line:#19232a; --soft:#131b21;
  --ink:#fcf8f1; --muted:#9aa3a8; --faint:#646d73; --aink:#fac547; --amid:#eab532;
  --fail:#e06a3a; --warn:#eab532; --pass:#8fae5e;
  --fail-bg:#2a1710; --warn-bg:#2b2413; --pass-bg:#1e2717;}}
:root[data-theme="dark"]{--ground:#000001;--surface:#020405;--raised:#12171a;--line:#19232a;--soft:#131b21;
  --ink:#fcf8f1;--muted:#9aa3a8;--faint:#646d73;--aink:#fac547;--amid:#eab532;--fail:#e06a3a;--warn:#eab532;--pass:#8fae5e;--fail-bg:#2a1710;--warn-bg:#2b2413;--pass-bg:#1e2717;}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding-inline:20px}
header{border-bottom:1px solid var(--line)}
.hdr{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding-block:14px}
.brand{font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:-.02em}
.brand b{color:var(--aink)}
.repo{font-family:var(--mono);font-size:13px;color:var(--muted)}
.tot{font-family:var(--mono);font-size:12px;color:var(--faint);margin-left:auto;font-variant-numeric:tabular-nums}
.tot b{color:var(--ink);font-weight:600}
.shell{display:grid;grid-template-columns:184px 1fr;gap:26px;padding-block:22px 60px;align-items:start}
@media(max-width:860px){.shell{grid-template-columns:1fr;gap:14px}}
.rail{display:flex;flex-direction:column;gap:1px}
.shell>div:first-child{position:sticky;top:12px;display:flex;flex-direction:column;gap:18px}
@media(max-width:860px){.shell>div:first-child{position:static;gap:12px}}
.rail.tm h3{margin-bottom:5px}
/* A denser rail than Elevation: these are timestamps, not destinations, so the
   hash leads and everything around it gives way. */
.rail.tm .lvl{padding:4px 8px;grid-template-columns:18px 1fr;gap:7px;line-height:1.2}
.rail.tm .t{color:var(--faint);font-weight:600;font-size:9.5px}
.rail.tm .n{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:-.02em}
.rail.tm .c{font-size:9.5px;letter-spacing:0}
.rail.tm .lvl[aria-current="true"] .t{color:var(--aink)}
.tmnote{font-family:var(--mono);font-size:9.5px;color:var(--faint);padding:5px 8px 0;max-width:184px;line-height:1.35}
.tmlink{color:var(--aink);text-decoration:none}
.tmlink:hover{text-decoration:underline}
/* A commit is scored by fetching and extracting it, so the rail fills in as
   each one lands rather than withholding the whole menu. */
.lvl.pending{cursor:default}
.lvl.pending .n,.lvl.pending .c{color:transparent;position:relative;display:inline-block;border-radius:3px;
  background:var(--soft);min-width:66px;animation:pulse 1.15s ease-in-out infinite}
.lvl.pending .c{min-width:44px;height:9px}
.lvl.pending .t{color:var(--faint)}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.9}}
@media(prefers-reduced-motion:reduce){.lvl.pending .n,.lvl.pending .c{animation:none;opacity:.6}}
@media(max-width:860px){.rail{position:static;flex-direction:row;overflow-x:auto;gap:6px}}
.rail h3{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin:0 0 8px 2px}
@media(max-width:860px){.rail h3{display:none}}
.lvl{display:grid;grid-template-columns:26px 1fr;gap:9px;align-items:center;background:0;border:0;
  border-left:2px solid var(--soft);padding:9px 10px;cursor:pointer;text-align:left;color:var(--muted);font-family:var(--ui);white-space:nowrap}
.lvl:hover{color:var(--ink);background:var(--raised)}
.lvl[aria-current="true"]{border-left-color:var(--amber);color:var(--ink);background:var(--raised)}
.lvl .t{font-family:var(--mono);font-size:11px;color:var(--aink);font-weight:700}
.lvl .n{font-size:13.5px;font-weight:500}
.lvl .c{font-family:var(--mono);font-size:11px;color:var(--faint)}
@media(max-width:860px){.lvl{border-left:0;border-bottom:2px solid var(--soft)}.lvl[aria-current="true"]{border-bottom-color:var(--amber)}.lvl .c{display:none}}
h2{margin:0 0 3px;font-size:24px;letter-spacing:-.02em;text-wrap:balance}
.lede{margin:0 0 16px;color:var(--muted);font-size:14px;max-width:66ch}
.scope{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--faint);margin-bottom:10px;flex-wrap:wrap}
.scope b{color:var(--aink)}
.scope button{font:inherit;background:var(--raised);border:1px solid var(--line);border-radius:5px;padding:1px 7px;cursor:pointer;color:var(--muted)}
.scope button:hover{border-color:var(--amber);color:var(--ink)}
/* score */
.rings{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;padding:14px 10px 12px;
  border-bottom:1px solid var(--line);margin-bottom:8px}
.ring{background:0;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--ui)}
.ring svg{width:62px;height:62px;display:block}
/* The disc carries a wash of the band colour, so the score reads before the
   number does — the ring alone is a thin signal at this size. */
.ring .fl{stroke:none}
.ring .tr{fill:none;stroke-width:4;opacity:.35}
.ring .ar{fill:none;stroke-width:4;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring .nm{font-family:var(--mono);font-size:19px;font-weight:600;dominant-baseline:central;text-anchor:middle}
.ring .cap{font-size:12.5px;font-weight:500;color:var(--ink)}
.ring .dl{font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:-.01em}
.ring .dl.up{color:var(--pass)} .ring .dl.dn{color:var(--fail)}
.ring:hover .cap{color:var(--aink)}
/* explainers */
.cat{padding:26px 0 4px;border-top:1px solid var(--soft)}
.cat:first-of-type{border-top:0}
.cat .ch{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.cat h3{margin:0;font-size:19px;letter-spacing:-.01em}
.cat .cs{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1}
.cat .cl{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto}
.cat .cd{margin:6px 0 14px;color:var(--muted);font-size:14px;max-width:68ch}
.rule{border:1px solid var(--soft);border-left:3px solid var(--soft);border-radius:8px;background:var(--surface);
  padding:13px 15px;margin-bottom:9px}
.rule.hit{border-left-color:var(--fail)}
.rule.ok{opacity:.72}
.rule .rh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:5px}
.rule .rn{font-family:var(--mono);font-size:13px;font-weight:600}
.rule .rv{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rule .rd{font-family:var(--mono);font-size:12.5px;font-weight:600;margin-left:auto}
.rule .rd.hot{color:var(--fail)} .rule .rd.none{color:var(--faint);font-weight:400}
.rule .rw{margin:0 0 8px;font-size:13.5px;color:var(--muted);max-width:74ch}
.rule .rx{margin:0 0 10px;font-size:13.5px;color:var(--ink);max-width:74ch;padding-left:13px;border-left:2px solid var(--amber)}
.rule .rx code{font-family:var(--mono);font-size:12.5px;color:var(--aink)}
.rule details{margin-top:2px}
.rule summary{font-family:var(--mono);font-size:11.5px;color:var(--aink);cursor:pointer;list-style:none}
.rule summary::-webkit-details-marker{display:none}
.rule summary:hover{text-decoration:underline}
.flist{font-family:var(--mono);font-size:11.5px;margin-top:8px;display:grid;gap:2px}
.flist div{display:flex;gap:10px}
.flist .fl-f{color:var(--faint);white-space:nowrap}
.flist .fl-w{color:var(--muted);overflow-wrap:anywhere}
.legend{display:flex;gap:20px;justify-content:center;padding:9px 14px;margin:26px auto 0;border:1px solid var(--soft);border-radius:7px;width:max-content;font-family:var(--mono);font-size:11px;color:var(--faint)}
.legend i{display:inline-block;width:8px;height:8px;margin-right:6px}
.legend .f{background:var(--fail);clip-path:polygon(50% 0,100% 100%,0 100%)}
.legend .w{background:var(--warn)} .legend .p{background:var(--pass);border-radius:50%}
/* shared */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(204px,1fr));gap:9px}
.card{background:var(--surface);border:1px solid var(--soft);border-radius:8px;padding:11px 12px;cursor:pointer;
  display:flex;flex-direction:column;gap:7px;text-align:left;font-family:var(--ui);color:var(--ink)}
.card:hover{border-color:var(--amber);background:var(--raised)}
.card .nm{font-family:var(--mono);font-size:13px;font-weight:600;overflow-wrap:anywhere}
.card .mt{display:flex;gap:9px;font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--soft);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber)}
.bg{display:flex;flex-wrap:wrap;gap:4px}
.b{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.b.spawns,.b.reads_env{color:var(--aink);border-color:var(--amber)}
.b.effect_exec{color:var(--fail);border-color:var(--fail)}
.b.unsafe_at{color:var(--warn);border-color:var(--warn)}
.tbl{overflow-x:auto;border:1px solid var(--soft);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px}
th{text-align:left;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 12px;border-bottom:1px solid var(--soft);vertical-align:top;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--raised)}
.loc{color:var(--faint);white-space:nowrap} .dim{color:var(--faint)} .hot{color:var(--fail)} .acc{color:var(--aink)}
.jump{font:inherit;background:0;border:0;color:var(--aink);cursor:pointer;padding:0}
.jump:hover{text-decoration:underline}
.sect{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:22px 0 8px}
.toggle{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.toggle button{font-family:var(--mono);font-size:11.5px;padding:3px 10px;border:1px solid var(--line);background:var(--surface);
  border-radius:5px;cursor:pointer;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--amber);color:#020405;border-color:var(--amid)}
/* signature */
.sig{background:var(--surface);border:1px solid var(--soft);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.sig .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:7px}
.sig .fn{font-family:var(--mono);font-size:13.5px;font-weight:600}
.sig .wh{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto}
.sig code{font-family:var(--mono);font-size:12.5px;display:block;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);margin-bottom:8px}
.ann{display:grid;grid-template-columns:auto auto 1fr;gap:2px 14px;font-family:var(--mono);font-size:11.5px;align-items:baseline}
.ann .k{color:var(--muted)} .ann .t{color:var(--ink)} .ann .o{color:var(--aink)}
.ann .o.un{color:var(--faint)} .ann .o.am{color:var(--warn)}
.ann .d1 .k{padding-left:14px;color:var(--faint)}
.empty{padding:38px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px}
</style>
</head>

</div>

<script>
const D=JSON.parse(document.getElementById('d').textContent);
const $=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=x=>(x??0).toLocaleString();
const EL={spawns:'spawn',reads_env:'env',effect_exec:'exit',unsafe_at:'unsafe',effect_fs:'fs',effect_net:'net'};
const LEVELS=[
 {id:'L0',name:'Score',count:()=>Object.keys(D.score.scores).length+' categories'},
 {id:'L1',name:'System',count:()=>D.effects.filter(e=>e.k==='spawns').length+' spawns'},
 {id:'L2',name:'Packages',count:()=>D.packages.length+' crates'},
 {id:'L3',name:'Files',count:()=>D.files.length+' files'},
 {id:'L4',name:'Types',count:()=>n(D.totals.types)},
 {id:'L5',name:'Functions',count:()=>n(D.totals.functions)},
];
// Newest first: L0 is HEAD, and each step down the rail is a commit further back.
const TIMELINE=D.history.slice().reverse();
let S={level:'L0',pkg:null,file:null,cat:null,commit:0};
const band=v=>v>=90?'var(--pass)':v>=50?'var(--warn)':'var(--fail)';
const pkgName=id=>(D.packages.find(p=>p.id===id)||{}).name||'';

/* The commit being viewed, and the one before it — the delta is between them. */
const viewed=()=>TIMELINE[S.commit]||null;
const scoresNow=()=>{
  const v=viewed();
  // The standalone score run is HEAD's and carries the rule breakdown; the walk
  // only carries category scores, so an older commit shows rings alone.
  return S.commit===0?D.score.scores:(v?v.scores:D.score.scores);
};
const baselineScores=()=>{const p=TIMELINE[S.commit+1];return p?p.scores:null;};

const rail=document.getElementById('rail');
LEVELS.forEach(l=>{
  const b=$(`<button class="lvl" data-l="${l.id}"><span class="t">${l.id}</span><span><span class="n">${l.name}</span><br><span class="c">${esc(l.count())}</span></span></button>`);
  b.onclick=()=>{S.level=l.id;render();};rail.appendChild(b);
});
const tm=document.getElementById('tm');
const when=iso=>{const d=new Date(iso);return isNaN(d)?'':d.toLocaleString(undefined,
  {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});};
const SLOTS=Math.min(5,TIMELINE.length);
let loaded=0;
for(let i=0;i<SLOTS;i++){
  const b=$(`<button class="lvl pending" data-tm="${i}" disabled><span class="t">L${i}</span><span><span class="n">········</span><br><span class="c">·····</span></span></button>`);
  tm.appendChild(b);
}
const tmnote=$(`<div class="tmnote">scoring ${SLOTS} commits…</div>`);
tm.appendChild(tmnote);
/* Each commit has to be fetched and extracted before it can be scored, so the
   rail resolves one slot at a time. Staged here so the treatment can be judged;
   on the live site the timing is whatever the work takes. */
function resolveSlot(i){
  const c=TIMELINE[i], b=tm.querySelector(`[data-tm="${i}"]`);
  if(!c||!b) return;
  b.classList.remove('pending');
  b.disabled=false;
  b.querySelector('.n').textContent=c.short;
  b.querySelector('.c').textContent=when(c.date);
  b.onclick=()=>{S.commit=i;S.level='L0';render();};
  loaded++;
  if(loaded===SLOTS){
    // The note has a job while the rail is filling and none once it has; the
    // repository link already lives in the header.
    tmnote.remove();
    render();
  }
}
for(let i=0;i<SLOTS;i++) setTimeout(()=>resolveSlot(i), 260+i*240);
// The repository name goes where the code does.
document.getElementById('repo').innerHTML = D.commits_url
  ? `<a class="tmlink" href="${esc(D.commits_url)}" target="_blank" rel="noopener">${esc(D.repo)} ↗</a>`
  : esc(D.repo);
document.getElementById('tot').innerHTML=`<b>${n(D.totals.nodes)}</b> nodes · <b>${n(D.totals.edges)}</b> edges · <b>${n(D.totals.lines)}</b> lines`;

const badges=e=>{const o=['spawns','reads_env','effect_exec','unsafe_at','effect_fs','effect_net']
  .filter(k=>e[k]).map(k=>`<span class="b ${k}">${EL[k]} ${e[k]}</span>`).join('');
  return `<div class="bg">${o||'<span class="b">no effects</span>'}</div>`;};

function scopeBar(){
  if(!S.pkg&&!S.file) return '';
  const bits=[];
  if(S.pkg) bits.push(`<b>${esc(pkgName(S.pkg))}</b>`);
  if(S.file) bits.push(`<b>${esc((D.files.find(f=>f.id===S.file)||{}).path||'')}</b>`);
  return `<div class="scope">scope: ${bits.join(' / ')} <button data-clear>clear</button></div>`;
}
function wireScope(el){const b=el.querySelector('[data-clear]'); if(b) b.onclick=()=>{S.pkg=null;S.file=null;render();};}

/* ---------- L0 Score ---------- */
const CATDESC={
 quality:"Reinvention and silencing: the same thing written twice, and the compiler told not to mention it. These are the shapes code takes when it is written fast by many hands.",
 containment:"Whether an effect stays in the crate that should own it. A library reaching for the process is the clearest case — it takes a decision away from every caller.",
 security:"Reach that somebody else could steer. Not how much the code can do, but how much of what it does is decided at runtime by something outside it.",
 legibility:"How much of this codebase could be proved rather than guessed at. A measurement of certainty, not a judgement — but what a parser cannot follow, the next author cannot either.",
 modularity:"House standards rather than facts about good code. Measured across ripgrep, tokio and deno, file length tracks a project's habits, so these defaults are deliberately lenient and the thresholds are yours to set.",
};
function L0(){
  const c0=viewed(), base=baselineScores(), head=S.commit===0;
  const cats=Object.entries(scoresNow());
  const rings=cats.map(([c,v])=>{
    const C=2*Math.PI*26,off=C*(1-v/100);
    const d=base&&base[c]!==undefined?v-base[c]:null;
    const dl=(d===null||d===0)?''
      :`<span class="dl ${d>0?'up':'dn'}">${d>0?'+':''}${d} since commit ${esc(TIMELINE[S.commit+1].short)}</span>`;
    const tint=v>=90?'var(--pass-bg)':v>=50?'var(--warn-bg)':'var(--fail-bg)';
    return `<button class="ring" data-c="${c}">
      <svg viewBox="0 0 62 62"><circle class="fl" cx="31" cy="31" r="28" fill="${tint}"/>
      <circle class="tr" cx="31" cy="31" r="26" stroke="${band(v)}"/>
      <circle class="ar" cx="31" cy="31" r="26" stroke="${band(v)}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
      <text class="nm" x="31" y="31" fill="${band(v)}">${v}</text></svg>
      <span class="cap">${c[0].toUpperCase()+c.slice(1)}</span>${dl}</button>`;}).join('');

  const sections = head ? cats.map(([c,v])=>{
    const rs=D.score.rules.filter(r=>r.category===c).sort((a,b)=>b.deducted-a.deducted);
    const lost=rs.reduce((a,r)=>a+r.deducted,0);
    const cards=rs.map(r=>{
      const hit=r.deducted>0;
      const fs=(r.findings||[]).map(f=>`<div><span class="fl-f">${esc(f.file)}${f.line?':'+f.line:''}</span><span class="fl-w">${esc(f.what)}</span></div>`).join('');
      const more=r.total_findings>r.findings.length?`<div><span class="fl-f">…</span><span class="fl-w">${n(r.total_findings-r.findings.length)} more</span></div>`:'';
      return `<div class="rule ${hit?'hit':'ok'}">
        <div class="rh"><span class="rn">${esc(r.rule)}</span>
          <span class="rv">measured ${r.value.toFixed(2)} · free below ${D.score.config.rules[r.rule].free} · full at ${D.score.config.rules[r.rule].full} · max ${r.weight}</span>
          <span class="rd ${hit?'hot':'none'}">${hit?'−'+r.deducted.toFixed(1)+(r.capped?' capped':''):'no deduction'}</span></div>
        <p class="rw">${esc(r.describes)}</p>
        ${hit?`<p class="rx">${esc(r.remedy)}</p>`:''}
        ${fs?`<details><summary>${n(r.total_findings)} finding${r.total_findings===1?'':'s'}</summary><div class="flist">${fs}${more}</div></details>`:''}
      </div>`;}).join('');
    return `<section class="cat" id="cat-${c}">
      <div class="ch"><span class="cs" style="color:${band(v)}">${v}</span><h3>${c[0].toUpperCase()+c.slice(1)}</h3>
        <span class="cl">100 ${lost>0?'− '+lost.toFixed(1):''} · ${rs.filter(r=>r.deducted>0).length} of ${rs.length} rules degraded</span></div>
      <p class="cd">${CATDESC[c]||''}</p>${cards}</section>`;}).join('')
    : `<div class="empty">Per-rule detail is only kept for head. The walk records a score per category per commit; retaining every commit's findings needs <code>cqx history --keep-facts</code>.</div>`;

  const at=head?'':`<div class="scope">viewing <b>${esc(c0.short)}</b> · ${esc(c0.subject)} <button data-head>back to head</button></div>`;
  const el=$(`<div><h2>CodeQuality Score</h2>${at}
    <p class="lede">Every category starts at 100 and is degraded only by a named rule with a published weight and a cap. Each section below says what was measured, why it counts, and what to do about it.</p>
    <div class="rings">${rings}</div>${sections}
    <div class="legend"><span><i class="f"></i>0–49</span><span><i class="w"></i>50–89</span><span><i class="p"></i>90–100</span></div></div>`);
  const bh=el.querySelector('[data-head]'); if(bh) bh.onclick=()=>{S.commit=0;render();};
  el.querySelectorAll('.ring').forEach(b=>b.onclick=()=>{
    document.getElementById('cat-'+b.dataset.c)?.scrollIntoView({behavior:'smooth',block:'start'});});
  return el;
}

/* ---------- L1 System ---------- */
function L1(){
  const sp={},en={};
  D.effects.forEach(e=>{if(e.k==='spawns'){(sp[e.to]??={n:0,r:[]}).n++;sp[e.to].r.push(e);}
    if(e.k==='reads_env'){(en[e.to]??=0);en[e.to]++;}});
  const rows=Object.entries(sp).sort((a,b)=>b[1].n-a[1].n).map(([nm,v])=>{const r=v.r[0];
    const prov=r.via==='env'?`<span class="acc">${esc(r.src)}()</span> <span class="dim">←</span> <span class="hot">$${esc((r.env||'').split(',')[0])}</span>`
      :r.via==='fn'?`<span class="dim">from</span> ${esc(r.src)}()`:r.via==='unresolved'?'<span class="dim">unresolved</span>':'<span class="dim">literal</span>';
    return `<tr><td>${nm==='<dynamic>'?'<span class="dim">&lt;dynamic&gt;</span>':'<b>'+esc(nm)+'</b>'}</td><td>${v.n}</td><td>${prov}</td><td class="loc">${esc(r.file)}:${r.line}</td></tr>`;}).join('');
  return $(`<div><h2>What it touches outside itself</h2>
    <p class="lede">Every process, variable and capability the binaries can reach. The only elevation small enough to read whole.</p>
    <div class="sect">Processes it can start</div>
    <div class="tbl"><table><thead><tr><th>target</th><th>sites</th><th>how the name is decided</th><th>first site</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="sect">Environment variables read</div>
    <div class="bg">${Object.entries(en).sort((a,b)=>b[1]-a[1]).map(([k,c])=>`<span class="b ${k==='<dynamic>'?'':'reads_env'}">${esc(k)} ${c}</span>`).join('')}</div></div>`);
}

/* ---------- L2 Packages ---------- */
function L2(){
  const mx=Math.max(...D.packages.map(p=>p.lines));
  const el=$(`<div><h2>${D.packages.length} crates</h2>
    <p class="lede">Sized by lines, badged by what each reaches. Selecting one scopes every elevation below.</p>
    <div class="grid">${D.packages.slice().sort((a,b)=>b.lines-a.lines).map(p=>`
      <button class="card" data-p="${esc(p.id)}"><span class="nm">${esc(p.name)}</span>
      <span class="mt"><span>${n(p.files)} files</span><span>${n(p.lines)} lines</span></span>
      <span class="bar"><i style="width:${Math.max(3,Math.round(p.lines/mx*100))}%"></i></span>
      ${badges(p.eff)}</button>`).join('')}</div></div>`);
  el.querySelectorAll('.card').forEach(c=>c.onclick=()=>{S.pkg=c.dataset.p;S.file=null;S.level='L3';render();});
  return el;
}

/* ---------- L3 Files ---------- */
function L3(){
  let fs=D.files.slice();
  if(S.pkg) fs=fs.filter(f=>f.pkg===S.pkg);
  fs.sort((a,b)=>b.lines-a.lines);
  const el=$(`<div>${scopeBar()}<h2>${n(fs.length)} files</h2>
    <p class="lede">${S.pkg?'In '+esc(pkgName(S.pkg))+'. ':''}Ordered by size. Selecting one scopes Types and Functions.</p>
    <div class="grid">${fs.map(f=>`<button class="card" data-f="${esc(f.id)}">
      <span class="nm">${esc(f.path.split('/').slice(2).join('/'))}</span>
      <span class="mt"><span>${n(f.lines)} lines</span><span>${n(f.n)} symbols</span></span>${badges(f.eff)}</button>`).join('')||'<div class="empty">No files in scope.</div>'}</div></div>`);
  wireScope(el);
  el.querySelectorAll('.card').forEach(c=>c.onclick=()=>{S.file=c.dataset.f;S.level='L4';render();});
  return el;
}

/* ---------- L4 Types ---------- */
function L4(){
  const fp=S.file?(D.files.find(f=>f.id===S.file)||{}).path:null;
  let ts=D.types.slice();
  if(fp) ts=ts.filter(t=>t.file===fp);
  else if(S.pkg) ts=ts.filter(t=>t.pkg===pkgName(S.pkg));
  const shown=ts;
  const el=$(`<div>${scopeBar()}<h2>Types</h2>
    <p class="lede">Declarations this repository owns, ordered by how often they appear in a signature. A type used nowhere is not necessarily dead, but it is not part of any contract.</p>
    <div class="tbl"><table><thead><tr><th>type</th><th>kind</th><th>crate</th><th>used in</th><th>fields</th></tr></thead><tbody>
    ${shown.slice(0,120).map(t=>`<tr><td><b>${esc(t.name)}</b></td><td class="dim">${esc(t.k)}</td>
      <td class="acc">${esc(t.pkg||'')}</td><td>${t.uses||'<span class="dim">0</span>'}</td>
      <td class="dim">${t.fields.length?esc(t.fields.slice(0,4).map(f=>f[0]+': '+f[1]).join(', ')):'—'}</td></tr>`).join('')
      ||'<tr><td colspan="5" class="dim">No types in scope.</td></tr>'}</tbody></table></div>
    <p class="lede" style="margin-top:10px">${n(shown.length)} shown${shown.length>120?' (first 120)':''}.</p></div>`);
  wireScope(el);
  return el;
}

/* ---------- L5 Functions ---------- */
function L5(){
  const fp=S.file?(D.files.find(f=>f.id===S.file)||{}).path:null;
  let fs=D.functions.slice();
  if(fp) fs=fs.filter(f=>f.file===fp);
  else if(S.pkg) fs=fs.filter(f=>f.pkg===pkgName(S.pkg));
  const sigs=fs.slice(0,40).map(f=>{
    const ps=f.p.map(([nm,txt])=>`${nm}: ${txt}`).join(', ');
    const sig=`fn ${f.name}(${ps})${f.r?' -> '+f.r[0]:''}`;
    const rows=[];
    f.p.forEach(([nm,txt,parts])=>{
      parts.forEach((pt,i)=>{
        const [base,own,d]=pt;
        rows.push(`<div class="k${d?' d1':''}">${d?'└ '+esc(base):esc(nm)}</div><div class="t">${esc(d?base:txt)}</div><div class="o ${own?(own==='~'?'am':''):'un'}">${own==='~'?'ambiguous':(own||'—')}</div>`);
      });
    });
    if(f.r) f.r[1].forEach(pt=>{const [base,own,d]=pt;
      rows.push(`<div class="k${d?' d1':''}">${d?'└ '+esc(base):'→'}</div><div class="t">${esc(d?base:f.r[0])}</div><div class="o ${own?(own==='~'?'am':''):'un'}">${own==='~'?'ambiguous':(own||'—')}</div>`);});
    return `<div class="sig"><div class="hd"><span class="fn">${esc(f.name)}</span>
      <span class="bg">${f.eff.map(k=>`<span class="b ${k}">${EL[k]}</span>`).join('')}</span>
      <span class="wh">${esc(f.file||'')}</span></div>
      <code>${esc(sig)}</code><div class="ann">${rows.join('')}</div></div>`;
  }).join('');
  const el=$(`<div>${scopeBar()}<h2>Functions</h2>
    <p class="lede">Signatures with the crate that owns each type underneath. Showing those that carry an effect, return an unstructured error, or take three or more parameters — ${n(D.totals.notable)} of ${n(D.totals.functions)}.</p>
    ${sigs||'<div class="empty">No notable functions in scope.</div>'}
    <p class="lede" style="margin-top:10px">${n(fs.length)} in scope${fs.length>40?', first 40 shown':''}.</p></div>`);
  wireScope(el);
  return el;
}

function render(){
  document.querySelectorAll('#rail .lvl').forEach(b=>b.setAttribute('aria-current',String(b.dataset.l===S.level)));
  document.querySelectorAll('#tm .lvl').forEach(b=>b.setAttribute('aria-current',String(+b.dataset.tm===S.commit)));
  const st=document.getElementById('stage');st.innerHTML='';
  st.appendChild({L0,L1,L2,L3,L4,L5}[S.level]());
  window.scrollTo(0,0);
}
render();
</script>
</body>
</html>
