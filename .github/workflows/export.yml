name: export

# Datasets for the repositories this deployment opens with.
#
# Nothing here rebuilds the website. The explorer reads its data from a bucket
# at request time, so a new commit becomes visible as soon as this job uploads
# it — there is no deploy in the loop.
on:
  workflow_dispatch:
  schedule:
    # Nightly, so a repository nobody dispatched from still stays current.
    - cron: '0 6 * * *'
  # Upstream repositories dispatch here after a merge:
  #   gh api repos/samifouad/cqx-web/dispatches -f event_type=export
  repository_dispatch:
    types: [export]

env:
  # Written by `cqx export`, read by the explorer. One bucket, one domain.
  BUCKET: cqx
  COMMITS: 5

jobs:
  export:
    runs-on: ubuntu-latest
    strategy:
      # Sequential: two jobs uploading to one bucket is not faster, and a
      # failure in one should not leave the other half-published.
      max-parallel: 1
      matrix:
        repo: [dekaruntime/deka, dekaruntime/dsc]
    steps:
      # The binary is a release artefact, so this job needs no Rust toolchain
      # and takes seconds rather than minutes.
      - name: Fetch cqx
        run: |
          gh release download --repo samifouad/cqx --pattern cqx-linux-x86_64 --output cqx
          gh release download --repo samifouad/cqx --pattern SHA256SUMS --output SHA256SUMS
          grep cqx-linux-x86_64 SHA256SUMS | sed 's|cqx-linux-x86_64|cqx|' | sha256sum -c -
          chmod +x cqx
        env:
          GH_TOKEN: ${{ github.token }}

      # Deep enough that a first-parent walk of five commits cannot run out of
      # history on a branch that merges often.
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          path: src
          fetch-depth: 60

      - name: Take down what is already exported
        run: |
          mkdir -p out/${{ matrix.repo }}
          for sha in $(git -C src rev-list --first-parent -n ${{ env.COMMITS }} HEAD | cut -c1-8); do
            # A dataset names its commit and describes nothing else, so one that
            # exists is the answer — not a cache of it. Fetching it here is what
            # stops this job re-analysing commits it has already seen.
            npx --yes wrangler@4 r2 object get \
              "$BUCKET/${{ matrix.repo }}/$sha.json" \
              --file "out/${{ matrix.repo }}/$sha.json" --remote 2>/dev/null \
              && echo "have $sha" || echo "need $sha"
          done
          ls out/${{ matrix.repo }} > before.txt || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Export
        run: ./cqx export src --commits ${{ env.COMMITS }} --name ${{ matrix.repo }} --out out

      - name: Put back what is new
        run: |
          for path in out/${{ matrix.repo }}/*.json; do
            name=$(basename "$path")
            # index.json is the one file that changes, so it always goes up.
            if [ "$name" != "index.json" ] && grep -qx "$name" before.txt; then
              echo "unchanged $name"
              continue
            fi
            npx --yes wrangler@4 r2 object put \
              "$BUCKET/${{ matrix.repo }}/$name" \
              --file "$path" --content-type application/json --remote
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Say what is live
        run: |
          echo "### ${{ matrix.repo }}" >> $GITHUB_STEP_SUMMARY
          python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          index = json.load(open('out/${{ matrix.repo }}/index.json'))
          print('| commit | subject | ' + ' | '.join(index['commits'][0]['scores']) + ' |')
          print('|---|---|' + '---|' * len(index['commits'][0]['scores']))
          for c in reversed(index['commits']):
              print(f"| `{c['short']}` | {c['subject'][:48]} | "
                    + ' | '.join(str(v) for v in c['scores'].values()) + ' |')
          PY
