name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 22: `tests/rank.mjs` imports the ranker straight from its
          # TypeScript source, and Node strips the types itself from 23.6.
          node-version: 24
          cache: npm
      - run: npm ci
      # Cloudflare Pages builds main on its own, so this exists to catch a break
      # on the pull request rather than after it has already deployed.
      - run: npm run check
      # No test step: the only one left here drives a browser against a real
      # repository over the network, which makes it a good test and a bad
      # gate. The ranker it used to run moved to cqx-kit, which gates it.
      - run: npm run build
      - name: Report what would ship
        run: |
          echo "| file | size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          find dist -type f -printf '| %p | %s bytes |\n' 2>/dev/null \
            | sort >> "$GITHUB_STEP_SUMMARY" \
            || find dist -type f -exec stat -f '| %N | %z bytes |' {} + | sort >> "$GITHUB_STEP_SUMMARY"
